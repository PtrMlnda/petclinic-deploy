apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: verify-image-signature-eph
spec:
  evaluation:
    background:
      enabled: false
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values: [petclinic-dev, petclinic-prod]
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - UPDATE
        resources:
          - pods/ephemeralcontainers
  validationActions:
    - Deny
  matchImageReferences:
    - glob: "*"
  attestors:
    - name: cosign
      cosign:
        key:
          data: |
            -----BEGIN PUBLIC KEY-----
            MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEvF3IxE43viR9/XKtEJapXBW+3Kq5
            PFktQr0wehMB/J/MRgXhSWC1aWWK+dpgtQXKIWkEOLoqjR85mGo/lk4HYA==
            -----END PUBLIC KEY-----
        ctlog:
          insecureIgnoreTlog: true
  validations:
    - expression: 
        images.ephemeralContainers.all(i, verifyImageSignatures(i, [attestors.cosign]) > 0)
      message: Failed the image signature verifications
