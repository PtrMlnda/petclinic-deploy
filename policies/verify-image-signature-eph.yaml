apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: verify-image-signature-eph
spec:
  evaluation:
    background:
      enabled: false
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values: [petclinic-dev, petclinic-prod]
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - UPDATE
        resources:
          - pods/ephemeralcontainers
  validationActions:
    - Deny
  matchImageReferences:
    - glob: "*"
  attestors:
    - name: cosign
      cosign:
        keyless:
          identities:
            - subject: 'https://github.com/PtrMlnda/spring-petclinic/.github/workflows/build.yml@refs/heads/main'
              issuer: 'https://token.actions.githubusercontent.com'
  validations:
    - expression: 
        images.ephemeralContainers.all(i, verifyImageSignatures(i, [attestors.cosign]) > 0)
      message: Failed the image signature verifications
