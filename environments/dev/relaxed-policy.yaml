apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: injected-policy
spec:
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
  validationActions:
    - Audit
  validations:
    - expression: "true"
      message: Injected via the application repository.