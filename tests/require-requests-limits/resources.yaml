apiVersion: v1
kind: Namespace
metadata:
  name: petclinic-dev
  labels:
    kubernetes.io/metadata.name: petclinic-dev
---
apiVersion: v1
kind: Pod
metadata:
  name: no-resources
  namespace: petclinic-dev
spec:
  containers:
    - name: app
      image: nginx:1.27
---
apiVersion: v1
kind: Pod
metadata:
  name: no-cpu-request
  namespace: petclinic-dev
spec:
  containers:
    - name: app
      image: nginx:1.27
      resources:
        requests:
          memory: "128Mi"
        limits:
          memory: "256Mi"
---
apiVersion: v1
kind: Pod
metadata:
  name: no-memory-request
  namespace: petclinic-dev
spec:
  containers:
    - name: app
      image: nginx:1.27
      resources:
        requests:
          cpu: "250m"
        limits:
          memory: "256Mi"
---
apiVersion: v1
kind: Pod
metadata:
  name: no-memory-limit
  namespace: petclinic-dev
spec:
  containers:
    - name: app
      image: nginx:1.27
      resources:
        requests:
          cpu: "250m"
          memory: "128Mi"
---
apiVersion: v1
kind: Pod
metadata:
  name: no-memory-limit-init
  namespace: petclinic-dev
spec:
  initContainers:
    - name: init
      image: busybox:1.37
      resources:
        requests:
          cpu: "250m"
          memory: "128Mi"
  containers:
    - name: app
      image: nginx:1.27
      resources:
        requests:
          cpu: "250m"
          memory: "128Mi"
        limits:
          memory: "256Mi"
---
apiVersion: v1
kind: Pod
metadata:
  name: compliant
  namespace: petclinic-dev
spec:
  containers:
    - name: app
      image: nginx:1.27
      resources:
        requests:
          cpu: "250m"
          memory: "128Mi"
        limits:
          memory: "256Mi"
